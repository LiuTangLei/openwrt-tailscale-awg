name: Daily Tailscale Version Check

permissions:
  contents: read

on:
  schedule:
    - cron: '0 4,8,18,22 * * *'
  workflow_dispatch:
    inputs:
      version_check_method:
        description: 'Version check method to use'
        type: choice
        options:
          - ghcr
          - tag
        default: 'tag'
        required: true

env:
  REPO_SMALL: "LiuTangLei/openwrt-tailscale-awg"
  REPO_SMALL_NAME: "openwrt-tailscale-awg"
  REPO_SMALL_OWNER: "LiuTangLei"

jobs:
  version-check:
    name: Check Version Differences
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      selected_version: ${{ steps.compare.outputs.selected_version }}
      check_method: ${{ steps.compare.outputs.check_method }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load check method from .config/check-method
        id: load-method
        run: |
          # 优先使用 workflow_dispatch 输入，其次读取配置文件，最后默认 tag
          if [ -n "${{ github.event.inputs.version_check_method }}" ]; then
            method="${{ github.event.inputs.version_check_method }}"
            echo "Using manually provided method: $method"
          elif [ -f .config/check-method ]; then
            method=$(cat .config/check-method | tr -d '[:space:]')
            echo "Using method from .config/check-method: $method"
          else
            method="tag"
            echo "Using default method: $method"
          fi

          # 输出给后续步骤使用
          echo "method=$method" >> $GITHUB_OUTPUT

      - name: Get GHCR stable version
        id: get_ghcr
        if: steps.load-method.outputs.method == 'ghcr'
        uses: actions/github-script@v6
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          script: |
            const token = process.env.GHCR_TOKEN;
            const res = await fetch(
              'https://api.github.com/orgs/tailscale/packages/container/tailscale/versions',
              { headers: { 
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github.v3+json'
                } 
              }
            );

            if (!res.ok) {
              const body = await res.text();
              throw new Error(`GHCR API returned ${res.status}: ${body}`);
            }

            const versions = await res.json();

            if (!Array.isArray(versions)) {
              console.log('Unexpected API response:', JSON.stringify(versions).slice(0, 500));
              throw new Error('GHCR API did not return an array. Token may be expired or lack read:packages scope.');
            }

            const latestStableObj = versions.find(v => {
              const tags = v.metadata?.container?.tags || [];
              return tags.includes('stable') && tags.includes('latest');
            });

            if (!latestStableObj) throw new Error('No version found with both stable and latest tags');

            const versionTag = (latestStableObj.metadata.container.tags || [])
              .filter(tag => tag !== 'latest' && tag !== 'stable')[0];

            if (!versionTag) throw new Error('No version tag found');

            console.log('Upstream latest stable version tag:', versionTag);
            core.setOutput('stable_version', versionTag);

      - name: Get latest published fork release
        id: get_tag_release
        uses: actions/github-script@v6
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: 'LiuTangLei',
              repo: 'tailscale'
            });
            if (data.draft || data.prerelease || !/^v\d+\.\d+\.\d+$/.test(data.tag_name)) {
              throw new Error('Expected a published stable fork release');
            }
            core.setOutput('tag', data.tag_name);

      - name: Get latest release tag from openwrt-tailscale
        id: get_small
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: '${{ env.REPO_SMALL_OWNER }}',
                repo: '${{ env.REPO_SMALL_NAME }}'
              });
              core.setOutput('tag', data?.tag_name || '');
            } catch (error) {
              core.setOutput('tag', '');
            }

      - name: Compare versions
        id: compare
        env:
          CHECK_METHOD: ${{ steps.load-method.outputs.method }}
          FORK_VERSION: ${{ steps.get_tag_release.outputs.tag }}
          GHCR_VERSION: ${{ steps.get_ghcr.outputs.stable_version }}
          PACKAGE_VERSION: ${{ steps.get_small.outputs.tag }}
        run: |
          # Only published fork releases can trigger a package build.
          # Package rebuild suffixes (-rN) must not trigger a downgrade loop.
          current_core="${PACKAGE_VERSION%-r*}"
          should_build=false
          if [ "$FORK_VERSION" != "$current_core" ]; then
            if [ "$CHECK_METHOD" != "ghcr" ] || [ "${GHCR_VERSION#v}" = "${FORK_VERSION#v}" ]; then
              should_build=true
            fi
          fi
          echo "Fork: $FORK_VERSION; package: $PACKAGE_VERSION; build: $should_build"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "selected_version=$FORK_VERSION" >> "$GITHUB_OUTPUT"
          echo "check_method=$CHECK_METHOD" >> "$GITHUB_OUTPUT"


  trigger-build:
    name: Trigger Build Workflow with Commit
    permissions:
      contents: write
    needs: version-check
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      ghcr_commit: ${{ steps.get_commit.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve published fork tag to commit
        id: get_commit
        env:
          RELEASE_TAG: ${{ needs.version-check.outputs.selected_version }}
        run: |
          git fetch --no-tags https://github.com/LiuTangLei/tailscale.git "refs/tags/$RELEASE_TAG"
          commit=$(git rev-parse 'FETCH_HEAD^{commit}')
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Update Makefile with new version and hash
        id: update_makefile
        run: |
          set -euo pipefail
          RAW_VER="${{ steps.get_commit.outputs.version }}"
          NEW_VER=$(echo "$RAW_VER" | sed 's/^v//')
          NEW_COMMIT="${{ steps.get_commit.outputs.commit }}"
          
          SOURCE_URL="https://codeload.github.com/LiuTangLei/tailscale/tar.gz/v${NEW_VER}?"
          echo "Downloading from $SOURCE_URL to calculate hash..."
          NEW_HASH=$(curl -fL "$SOURCE_URL" | sha256sum | awk '{print $1}')
          echo "New Hash: $NEW_HASH"

          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$NEW_VER/" package/tailscale/Makefile
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" package/tailscale/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=$NEW_HASH/" package/tailscale/Makefile
          sed -i "s/PKG_COMMIT:=.*/PKG_COMMIT:=$NEW_COMMIT/" package/tailscale/Makefile

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add package/tailscale/Makefile
          git commit -m "chore: update tailscale to ${{ steps.get_commit.outputs.version}} (${{ steps.get_commit.outputs.commit }})" || true
          git push origin main

      - name: Trigger build workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: build-tailscale
          token: ${{ secrets.PAT_TOKEN }}